<section [hidden]="!isVisible()" class="histogram-container">
    <canvas baseChart
            [type]="'bar'"
            [data]="probabilityChart.data"
            [options]="probabilityChart.options"
            [plugins]="probabilityChart.plugins"
    >
    </canvas>

    @if (totalRange(); as range) {
        <div class="slider-overlay"
             [style.--thumb-size.px]="probabilityChart.chartSliderInfo().size"
             [style.bottom.px]="probabilityChart.chartSliderInfo().bottom"
             [style.left.px]="probabilityChart.chartSliderInfo().left"
             [style.right.px]="probabilityChart.chartSliderInfo().right">
            <mat-slider [min]="range.min" [max]="range.max">
                <input matSliderStartThumb [ngModel]="selectedRange().min" (ngModelChange)="updateRange(false, $event)">
                <input matSliderEndThumb [ngModel]="selectedRange().max" (ngModelChange)="updateRange(true, $event)">
            </mat-slider>
        </div>

        <div class="histogram-inputs flex-container flex-row gap-1"
             [style.left.px]="probabilityChart.chartBounds().x"
             [style.top.px]="probabilityChart.chartBounds().y">
            <div>P(<input class="form-control form-control-sm slider-input"
                          [min]="range.min"
                          [max]="range.max"
                          [ngModel]="selectedRange().min"
                          (ngModelChange)="updateRange(false, $event)">
                &leq; X &leq;
                <input class="form-control form-control-sm slider-input"
                       [min]="range.min"
                       [max]="range.max"
                       [ngModel]="selectedRange().max"
                       (ngModelChange)="updateRange(true, $event)">)
                =
                <input class="form-control form-control-sm slider-input slider-input-lg" disabled
                       [value]="probability().toFixed(2)">
            </div>
        </div>
    }
</section>
