@if(gameState(); as state) {
    <game-session-game [sessionService]="sevenWondersService"
                       [(gameState)]="gameState"
    >
        <div class="main-container">
            <b class="flex-container text-center">
                Play the board game and save the game afterwards!
            </b>
        </div>

        <seven-wonders-duel-save-popup ngProjectAs="customSavePopup"
                [teams]="state.gameConfig.teams"
        />
    </game-session-game>
}
