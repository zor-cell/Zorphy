spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
  data:
    redis:
      host: redis
      port: 6379

app:
  base-url: https://server.zorphy.net/api/
  csrf:
    cookie:
      domain: "zorphy.net"
      secure: true
      same-site: "None"

file-storage:
  directory: /app/file-storage
  compression-rate: 20

server:
  servlet:
    session:
      cookie:
        secure: true
